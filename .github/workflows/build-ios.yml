name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.5.4-ios.2); leave empty to only build'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*-ios*']

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Intel pool: the arm64 macOS pool (macos-15/macos-latest) keeps cancelling
    # jobs for lack of capacity.
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x' # pubspec: >=3.35.5 <3.42.0
          channel: stable
          cache: true

      # Generates ios/ with `flutter create` and patches it (AppDelegate, Info.plist, Podfile, icon)
      - name: Set up iOS project
        run: bash tool/ios_setup.sh

      # Not committed in the repo: strings.g.dart (slang) and all *.g.dart / *.freezed.dart.
      # lib/pigeon/*.pi.dart is committed (Android only; iOS does not use pigeon).
      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      # Fails fast with readable Dart errors (warnings/infos are ignored).
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign -v > build.log 2>&1; then
            echo "::group::Errors"
            grep -nE "error:|Error:|\*\* BUILD FAILED|Command .* failed" build.log | tail -100 || true
            echo "::endgroup::"
            tail -200 build.log
            exit 1
          fi
          tail -20 build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry boorusphere-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: boorusphere-unsigned-ipa
          path: boorusphere-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Boorusphere iOS ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: boorusphere-unsigned.ipa
          body_path: RELEASE_NOTES_IOS.md
