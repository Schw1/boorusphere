name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.5.4-ios.2); leave empty to only build'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*-ios*']

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job can write (create the release).
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment); Dependabot keeps them up to date.
jobs:
  build:
    # Intel pool: the arm64 macOS pool (macos-15/macos-latest) keeps cancelling
    # jobs for lack of capacity.
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.x' # pubspec: >=3.41.0 <3.42.0
          channel: stable
          cache: true

      # Generates ios/ with `flutter create` and patches it (AppDelegate, Info.plist, Podfile, icon)
      - name: Set up iOS project
        run: bash tool/ios_setup.sh

      # Not committed in the repo: strings.g.dart (slang) and all *.g.dart / *.freezed.dart.
      # lib/pigeon/*.pi.dart is committed (Android only; iOS does not use pigeon).
      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build

      # Fails fast with readable Dart errors (warnings/infos are ignored).
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build iOS (no codesign)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          set -o pipefail
          # Version label shown in the app (About page and drawer)
          if [ -z "$RELEASE_TAG" ]; then
            BASE=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
            RELEASE_TAG="${BASE}-ios-dev+${GITHUB_SHA::7}"
          fi
          echo "IOS_RELEASE=$RELEASE_TAG"
          if ! flutter build ios --release --no-codesign -v \
              --dart-define=IOS_RELEASE="$RELEASE_TAG" > build.log 2>&1; then
            echo "::group::Errors"
            grep -nE "error:|Error:|\*\* BUILD FAILED|Command .* failed" build.log | tail -100 || true
            echo "::endgroup::"
            tail -200 build.log
            exit 1
          fi
          tail -20 build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry boorusphere-unsigned.ipa Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boorusphere-unsigned-ipa
          path: boorusphere-unsigned.ipa
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only for RELEASE_NOTES_IOS.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: boorusphere-unsigned-ipa

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Boorusphere iOS ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Builds from feature branches are test builds
          prerelease: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
          files: boorusphere-unsigned.ipa
          body_path: RELEASE_NOTES_IOS.md
