name: Check metadata

# Upstream Android (Play Store) metadata; only runs when fastlane/ changes.

on:
  push:
    paths:
      - "fastlane/**"
  pull_request:
    paths:
      - "fastlane/**"

permissions:
  contents: read

jobs:
  fastlane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@c8857fdbbd3e00f9a5cbe8604bcecfa95ce8fef8 # v2.1.0
        with:
          fastlaneDir: ./fastlane/metadata/android
          usePlayStoreLocales: true
