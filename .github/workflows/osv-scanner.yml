name: Dependency scan

# Checks pubspec.lock against the OSV vulnerability database (covers pub.dev
# advisories). Fails when a known vulnerability is found.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pubspec.lock', '.github/workflows/osv-scanner.yml']
  pull_request:
    paths: ['pubspec.lock', '.github/workflows/osv-scanner.yml']
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC, catches new advisories

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock
