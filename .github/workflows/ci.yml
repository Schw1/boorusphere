name: CI

# Upstream Android CI. In this fork it hangs in "Run code generators" for hours
# (it uses the newest stable Flutter), so it only runs on manual request.
on:
  workflow_dispatch:

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install grinder
        run: dart pub global activate grinder
      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get
      - name: Run code generators
        run: grind gencode genlang
      - name: Check code formatting
        run: grind chkfmt
      - name: Analyze code
        run: grind analyze
      - name: Perform testing
        run: grind test
