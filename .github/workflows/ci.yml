name: CI

# Analyze and test on Linux (fast, no macOS minutes). Replaces the upstream
# Android CI, which used the newest stable Flutter and hung in code generation.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.x' # keep in sync with build-ios.yml
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test tool

      - name: Test
        run: flutter test
